name: Encore Keepalive

# Keeps the Encore serverless instance warm by pinging the probe endpoint
# every ~2.5 minutes (twice per run). The job chains itself at the end of
# each run, so the loop does not depend on GitHub's schedule triggering.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: encore-keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping 1
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://staging-nezha-encore-nx5i.encr.app/nezha/status" || echo ERR)
          echo "$(date -u '+%F %T') status -> $code"
      - name: Pace 1 (sleep 150s)
        run: sleep 150
      - name: Ping 2
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://staging-nezha-encore-nx5i.encr.app/nezha/status" || echo ERR)
          echo "$(date -u '+%F %T') status -> $code"
      - name: Pace 2 (sleep 150s)
        run: sleep 150
      - name: Chain next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run keepalive.yml --ref main -R "$GITHUB_REPOSITORY" \
            && echo "chained next run" \
            || echo "chain dispatch failed (schedule will cover)"
