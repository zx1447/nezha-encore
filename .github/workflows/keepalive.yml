name: Encore Keepalive

# Keeps the Encore serverless instance warm by pinging the probe endpoint
# every ~5 minutes. The job chains itself at the end of each run, so the
# loop does not depend on GitHub's (unreliable) schedule triggering.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: encore-keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping endpoints
        run: |
          for u in "https://staging-nezha-encore-nx5i.encr.app/nezha/status"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$u" || echo ERR)
            echo "$(date -u '+%F %T') $u -> $code"
          done
      - name: Pace (sleep ~4 min)
        run: sleep 240
      - name: Chain next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run keepalive.yml --ref main -R "$GITHUB_REPOSITORY" \
            && echo "chained next run" \
            || echo "chain dispatch failed (schedule will cover)"
